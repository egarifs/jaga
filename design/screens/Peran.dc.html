<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Mulai atau gabung — Jaga</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6B55}a:hover{color:#2C4D3D}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F4EE; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F2A24; box-sizing: border-box; padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 22px">

<header style="min-height: 44px; display: flex; align-items: center; gap: 12px">
<a href="Login.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E4E1D8; display: flex; align-items: center; justify-content: center; color: #1F2A24"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="font-size: 13px; color: #5F6962; font-weight: 500">Masuk sebagai Dewi · akun Google</span>
</header>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em">Apa yang ingin Anda lakukan?</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5F6962">Setiap orang yang dirawat punya <strong style="color: #1F2A24">lingkaran</strong> sendiri: anak, cucu, menantu, ipar, atau sepupu yang ikut merawat. Anda bisa ikut di beberapa lingkaran sekaligus.</p>
</div>

<div role="radiogroup" aria-label="Pilihan" style="display: flex; flex-direction: column; gap: 12px">

<sc-if value="{{ mulaiOn }}" hint-placeholder-val="{{ true }}">
<button role="radio" aria-checked="true" onClick="{{ pickMulai }}" style="text-align: left; border-radius: 20px; border: 2px solid #3F6B55; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 12px; color: #1F2A24">
<span style="display: flex; justify-content: space-between; align-items: center; width: 100%"><span style="width: 44px; height: 44px; border-radius: 14px; background: #3F6B55; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span><span style="width: 24px; height: 24px; border-radius: 12px; background: #3F6B55; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Mulai merawat seseorang</strong><span style="font-size: 13px; line-height: 1.5; color: #5F6962">Buat lingkaran untuk orang tua, mertua, kakek-nenek, atau anak yang sedang sakit. Anda menjadi kepala lingkaran.</span></span>
<span style="display: flex; flex-wrap: wrap; gap: 6px"><span style="font-size: 11px; font-weight: 700; color: #2C4D3D; background: #E3ECE5; padding: 4px 8px; border-radius: 99px">Akses penuh</span><span style="font-size: 11px; font-weight: 700; color: #2C4D3D; background: #E3ECE5; padding: 4px 8px; border-radius: 99px">Atur tim &amp; wakil</span></span>
</button>
</sc-if>
<sc-if value="{{ mulaiOff }}" hint-placeholder-val="{{ false }}">
<button role="radio" aria-checked="false" onClick="{{ pickMulai }}" style="text-align: left; border-radius: 20px; border: 1px solid #DDD9CF; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 12px; color: #1F2A24">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #E3ECE5; color: #2C4D3D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Mulai merawat seseorang</strong><span style="font-size: 13px; line-height: 1.5; color: #5F6962">Buat lingkaran untuk orang tua, mertua, kakek-nenek, atau anak yang sedang sakit. Anda menjadi kepala lingkaran.</span></span>
</button>
</sc-if>

<sc-if value="{{ gabungOn }}" hint-placeholder-val="{{ false }}">
<button role="radio" aria-checked="true" onClick="{{ pickGabung }}" style="text-align: left; border-radius: 20px; border: 2px solid #3F6B55; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 12px; color: #1F2A24">
<span style="display: flex; justify-content: space-between; align-items: center; width: 100%"><span style="width: 44px; height: 44px; border-radius: 14px; background: #3F6B55; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg></span><span style="width: 24px; height: 24px; border-radius: 12px; background: #3F6B55; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Gabung ke lingkaran</strong><span style="font-size: 13px; line-height: 1.5; color: #5F6962">Ada keluarga yang sudah mengundang Anda. Akses Anda diatur oleh kepala lingkaran.</span></span>
<span style="display: flex; flex-wrap: wrap; gap: 6px"><span style="font-size: 11px; font-weight: 700; color: #2F5D8A; background: #E5EEF7; padding: 4px 8px; border-radius: 99px">Butuh kode undangan</span></span>
</button>
</sc-if>
<sc-if value="{{ gabungOff }}" hint-placeholder-val="{{ true }}">
<button role="radio" aria-checked="false" onClick="{{ pickGabung }}" style="text-align: left; border-radius: 20px; border: 1px solid #DDD9CF; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 12px; color: #1F2A24">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #E5EEF7; color: #2F5D8A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Gabung ke lingkaran</strong><span style="font-size: 13px; line-height: 1.5; color: #5F6962">Ada keluarga yang sudah mengundang Anda. Akses Anda diatur oleh kepala lingkaran.</span></span>
</button>
</sc-if>

</div>

<div style="margin-top: auto">
<sc-if value="{{ mulaiOn }}" hint-placeholder-val="{{ true }}">
<a href="OnbAnggota.dc.html" style="min-height: 52px; border-radius: 14px; background: #3F6B55; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Buat lingkaran</a>
</sc-if>
<sc-if value="{{ gabungOn }}" hint-placeholder-val="{{ false }}">
<a href="Gabung.dc.html" style="min-height: 52px; border-radius: 14px; background: #3F6B55; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Masukkan kode undangan</a>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pick: 'mulai' };
}
renderVals() {
const m = this.state.pick === 'mulai';
return {
mulaiOn: m, mulaiOff: !m, gabungOn: !m, gabungOff: m,
pickMulai: () => this.setState({ pick: 'mulai' }),
pickGabung: () => this.setState({ pick: 'gabung' })
};
}
}
</script>
</body>
</html>
