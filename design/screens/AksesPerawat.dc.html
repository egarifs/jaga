<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Atur peran &amp; akses — Jaga</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6B55}a:hover{color:#2C4D3D}
button{font-family:inherit;cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:#3F6B55;width:22px;height:22px;margin:0;flex:none;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F4EE; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1F2A24; box-sizing: border-box; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 12px">
<a href="TimPerawat.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E4E1D8; display: flex; align-items: center; justify-content: center; color: #1F2A24"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="width: 40px; height: 40px; border-radius: 20px; background: #F3E9D2; color: #6B5214; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">RN</span>
<span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 18px; font-weight: 700">Rina</h1><span style="font-size: 12px; color: #5F6962">Lingkaran Merawat Ayah · menunggu</span></span>
</header>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="hub" style="font-size: 12px; font-weight: 700; color: #5F6962; letter-spacing: 0.06em">HUBUNGAN DENGAN AYAH</label>
<select id="hub" style="min-height: 46px; border-radius: 12px; border: 1px solid #DDD9CF; background: #FFFFFF; padding: 0 10px; font-size: 15px; font-family: inherit; color: #1F2A24">
<option>Anak</option><option>Menantu</option><option>Cucu</option><option selected>Keponakan</option><option>Saudara kandung</option><option>Ipar</option><option>Sepupu</option>
</select>
</div>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 12px; font-weight: 700; color: #5F6962; letter-spacing: 0.06em; padding: 0; margin-bottom: 8px">PERAN DI LINGKARAN</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ roles }}" as="r" hint-placeholder-count="2">
<label style="min-height: 60px; border-radius: 12px; border: 1px solid #DDD9CF; background: #FFFFFF; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer">
<input type="radio" name="role" checked="{{ r.on }}" onChange="{{ r.pick }}" style="margin-top: 2px; width: 18px; height: 18px">
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px">{{ r.name }}</strong><span style="font-size: 11px; color: #5F6962; line-height: 1.4">{{ r.note }}</span></span>
</label>
</sc-for>
</div>
</fieldset>

<fieldset style="border: 1px solid #E4E1D8; margin: 0; background: #FFFFFF; border-radius: 16px; padding: 0 14px">
<legend style="font-size: 12px; font-weight: 700; color: #5F6962; letter-spacing: 0.06em; padding: 0; float: left; width: 100%; margin: 10px 0 2px">IZIN</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-top: 1px solid #F0EDE5; clear: both">
<span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14px">Tandai dosis diberikan</strong><span style="font-size: 12px; color: #5F6962">Selalu aktif</span></span>
<input type="checkbox" checked="{{ true }}" disabled="{{ true }}">
</label>
<sc-for list="{{ perms }}" as="x" hint-placeholder-count="2">
<label style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-top: 1px solid #F0EDE5; cursor: pointer">
<span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14px">{{ x.name }}</strong><span style="font-size: 12px; color: #5F6962">{{ x.note }}</span></span>
<input type="checkbox" role="switch" checked="{{ x.on }}" disabled="{{ x.locked }}" onChange="{{ x.toggle }}">
</label>
</sc-for>
</fieldset>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 12px; font-weight: 700; color: #5F6962; letter-spacing: 0.06em; padding: 0; margin-bottom: 8px">GILIRAN JAGA</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ shifts }}" as="s" hint-placeholder-count="3">
<label style="min-height: 50px; border-radius: 12px; border: 1px solid #DDD9CF; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; position: relative">
<input type="radio" name="shift" checked="{{ s.on }}" onChange="{{ s.pick }}" style="position: absolute; top: 6px; right: 6px; width: 16px; height: 16px">
<strong style="font-size: 13px">{{ s.name }}</strong><span style="font-size: 11px; color: #5F6962">{{ s.hours }}</span>
</label>
</sc-for>
</div>
</fieldset>

<p role="status" style="margin: 0; font-size: 13px; line-height: 1.5; color: #2C4D3D; background: #E3ECE5; border-radius: 12px; padding: 10px 12px">{{ summary }}</p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
<a href="TimPerawat.dc.html" style="min-height: 52px; border-radius: 14px; background: #3F6B55; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Setujui &amp; simpan</a>
<button style="min-height: 44px; border: 0; background: transparent; color: #B42318; font-size: 14px; font-weight: 600">Tolak permintaan</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { role: 'perawat', ubah: false, dok: false, shift: 'malam' };
}
renderVals() {
const st = this.state;
const wakil = st.role === 'wakil';
const roles = [
{ id: 'perawat', name: 'Perawat', note: 'Akses sesuai izin di bawah' },
{ id: 'wakil', name: 'Wakil kepala', note: 'Akses penuh, bisa atur tim' }
].map((r) => ({ ...r, on: st.role === r.id, pick: () => this.setState({ role: r.id }) }));
const perms = [
{ name: 'Ubah obat & jadwal', note: 'Tambah, ubah, atau hentikan obat', on: wakil || st.ubah, locked: wakil, toggle: () => this.setState({ ubah: !st.ubah }) },
{ name: 'Lihat dokumen medis', note: 'Resume dokter & hasil lab', on: wakil || st.dok, locked: wakil, toggle: () => this.setState({ dok: !st.dok }) }
];
const S = [
{ id: 'pagi', name: 'Pagi', hours: '06–14' },
{ id: 'sore', name: 'Sore', hours: '14–22' },
{ id: 'malam', name: 'Malam', hours: '22–06' }
];
const shifts = S.map((s) => ({ ...s, on: st.shift === s.id, pick: () => this.setState({ shift: s.id }) }));
const sh = S.find((s) => s.id === st.shift);
const can = ['menandai dosis'];
if (wakil || st.ubah) can.push('mengubah obat');
if (wakil || st.dok) can.push('melihat dokumen');
const summary = wakil
? 'Rina menjadi wakil kepala dengan akses penuh, giliran ' + sh.name.toLowerCase() + ' ' + sh.hours + '.'
: 'Rina merawat Ayah di giliran ' + sh.name.toLowerCase() + ' ' + sh.hours + ' dan bisa ' + can.join(', ') + '.';
return { roles, perms, shifts, summary };
}
}
</script>
</body>
</html>
