# Run on home-server1: docker compose --env-file /opt/secrets/jaga.env -f compose.yml up -d --build
services:
  jaga-db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: jaga
      POSTGRES_USER: jaga
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [jaga_pg:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaga -d jaga"]
      interval: 10s
      retries: 5
  jaga-api:
    build: ../backend
    restart: always
    depends_on: { jaga-db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://jaga:${DB_PASSWORD}@jaga-db:5432/jaga
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports: ["127.0.0.1:18082:3000"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
volumes:
  jaga_pg:
